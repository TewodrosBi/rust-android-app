[package]
name = "s24_dj_core"
version = "0.2.0"
edition = "2021"
authors = ["Principal Audio Systems Architect"]
description = "Low-latency AAudio, DSP & Hexagon HTP v75 4-Stem Engine for Samsung Galaxy S24 Ultra"

[lib]
name = "s24_dj_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable ONNX Runtime QNN Execution Provider wrapper alongside the native libQnnHtp.so C ABI loader
ort-qnn = ["dep:ort"]

[dependencies]
oboe = { version = "=0.6.1", default-features = false, features = [ "shared-stdcxx"] }
oboe-sys = { version = "=0.6.1", default-features = false, features = [ "shared-stdcxx"] }
rtrb = "=0.3.2"
portable-atomic = { version = "=1.9.0", features = ["float"] }
jni = { version = "=0.21.1", default-features = false }
log = "=0.4.22"
android_logger = "=0.14.1"
libm = "=0.2.8"
libc = "=0.2.159"
half = { version = "=2.4.1", default-features = false }
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "qnn", "half"], optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = false
overflow-checks = false

[profile.dev]
opt-level = 2
panic = "abort"