[package]
name = "rust_android_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["android-native-activity", "glow", "default_fonts"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
android_logger = "0.14"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.29", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "com.example.rustai"
apk_label = "Rust AI Chat"
label = "Rust AI Chat"
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
